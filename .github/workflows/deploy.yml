# GitHub Pages 배포
#
# 처음 한 번만 설정이 필요합니다:
#   저장소 > Settings > Pages > Build and deployment > Source 를
#   "GitHub Actions" 로 바꿔주세요.
#
# 그 뒤로는 아래 브랜치에 푸시할 때마다 자동으로 다시 배포됩니다.
# 주소: https://youn-ttunttun.github.io/doganitang/

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/website-development-hkhosu
  workflow_dispatch: # Actions 탭에서 수동으로도 실행할 수 있습니다

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 마지막 것만 살립니다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # 저장소 이름 하위 경로에 올라가므로 base를 맞춰줍니다.
          # 나중에 커스텀 도메인을 붙이면 '/' 로 바꾸세요.
          VITE_BASE: /doganitang/
          # 링크 공유 미리보기 이미지에 쓰는 사이트 전체 주소
          VITE_SITE_URL: https://youn-ttunttun.github.io/doganitang/
          # Supabase 접속 정보.
          #
          # publishable 키는 원래 브라우저에 노출되는 공개 키입니다. 빌드 결과물
          # 안에 어차피 들어가므로 여기 적어도 위험이 늘지 않습니다. 실제 보호는
          # DB의 RLS 정책이 합니다. (supabase/schema.sql 참고)
          #
          # 나중에 값을 바꾸고 싶으면 저장소 Settings > Secrets에 같은 이름으로
          # 넣으면 그쪽이 우선 적용됩니다.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://isnjjgnmfphxngcyfpjk.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WlMA3lO9wFBAUAM1xzs-aQ_3aqAM-cb' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
